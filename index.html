<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chie Apps</title>
<meta name="description" content="Apps by Chie: Sun Sizer Pro and Sun Sizer.">
<style>
:root{--bg1:#9FD0F2;--bg2:#4F86C4;--card:rgba(255,255,255,.92);--ink:#16324f;--muted:#4c6480;--gold:#E0A91B}
@media (prefers-color-scheme:dark){:root{--bg1:#1d3350;--bg2:#0e1a2b;--card:rgba(22,34,52,.92);--ink:#e8f0f8;--muted:#9fb3c8;--gold:#FFD95A}}
*{box-sizing:border-box}
html{background:var(--bg2)}
body{margin:0;font:17px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:linear-gradient(170deg,var(--bg1),var(--bg2)) no-repeat;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:56px 16px 64px}
header{color:#fff;text-align:center;margin-bottom:32px}
header h1{margin:0;font-size:44px;letter-spacing:-1px}
header p{margin:6px 0 0;opacity:.9}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 18px 50px rgba(10,30,60,.18);display:flex;gap:18px;align-items:center}
.icon{flex:none;width:72px;height:72px;border-radius:18px;background:linear-gradient(150deg,#FFE27A,#F5B53D);display:grid;place-items:center;font-size:38px}
.card h2{margin:0;font-size:22px}
.card p{margin:2px 0 8px;color:var(--muted)}
.links a{color:inherit;font-weight:600;margin-right:16px}
footer{text-align:center;color:#fff;opacity:.85;font-size:14px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chie</h1>
    <p>Field tools, made with care.</p>
  </header>
  <section class="card">
    <div class="icon" aria-hidden="true">☀️</div>
    <div>
      <h2>Sun Sizer Pro</h2>
      <p>An offline solar design toolkit for iPhone and iPad.</p>
      <div class="links"><a href="sunsizer/index.html">Learn more</a><a href="sunsizer/support.html">Support</a><a href="sunsizer/privacy.html">Privacy Policy</a></div>
    </div>
  </section>
  <footer>© 2026 Chie</footer>
</div>
</body>
</html>
